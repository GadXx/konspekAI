name: Проверки проекта

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: DATABASE_DIALECT=sqlite docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - run: POSTGRES_PASSWORD='ci-only-password-0123456789abcdef' DATABASE_URL='postgres://konspekai:ci-only-password-0123456789abcdef@postgres:5432/konspekai' docker compose -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.postgres.yml config --quiet
      - run: docker compose --profile ollama -f docker-compose.yml -f docker-compose.ollama.yml config --quiet
      - run: POSTGRES_PASSWORD='ci-only-password-0123456789abcdef' DATABASE_URL='postgres://konspekai:ci-only-password-0123456789abcdef@postgres:5432/konspekai' docker compose --profile postgres -f docker-compose.yml -f docker-compose.postgres.yml config --quiet
      - run: docker build --pull -f apps/api/Dockerfile -t konspekai:ci .
