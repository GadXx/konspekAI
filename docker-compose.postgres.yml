services:
  migrate:
    environment:
      DATABASE_DIALECT: postgres
      DATABASE_URL: ${DATABASE_URL:?Set a percent-encoded DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    environment:
      DATABASE_DIALECT: postgres
      DATABASE_URL: ${DATABASE_URL:?Set a percent-encoded DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    environment:
      DATABASE_DIALECT: postgres
      DATABASE_URL: ${DATABASE_URL:?Set a percent-encoded DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konspekai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-konspekai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-konspekai} -d ${POSTGRES_DB:-konspekai}"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: []
